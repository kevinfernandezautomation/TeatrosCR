ect,form textarea{width:100%;padding:.8rem;border:1px solid #cabcc1;border-radius:.6rem;background:var(--field);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.15rem;box-shadow:0 5px 18px var(--shadow)}.badge{display:inline-block;background:#f4e4ea;color:#651b39;border-radius:999px;padding:.2rem .55rem;font-size:.8rem}.meta{font-size:.92rem;color:var(--muted)}.social{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.8rem}.wa{background:#167b42}.notice{border-left:5px solid var(--brand);background:var(--notice);padding:1rem;border-radius:.5rem}.contact{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}form{background:var(--card);padding:1.2rem;border:1px solid var(--line);border-radius:1rem}label{font-weight:700;display:block;margin-top:.75rem}footer{background:var(--footer);color:#fff;padding:2rem 1rem}.access{position:fixed;right:1rem;bottom:1rem;border-radius:50%;width:52px;height:52px;font-size:1.35rem;z-index:30}.access-panel{position:fixed;right:1rem;bottom:4.8rem;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:1rem;border-radius:1rem;z-index:30;display:none;width:250px}.access-panel.show{display:block}.high{filter:contrast(1.35)}.large{font-size:19px}.underline a{text-decoration:underline!important;text-decoration-thickness:2px!important}@media(max-width:700px){.filters,.contact{grid-template-columns:1fr}.links{order:3;width:100%}.hero{padding:3.5rem 1rem}}

function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderArtists(){const q=qArtist.value.toLowerCase().trim(),r=artistRole.value;const list=artists.filter(a=>{if(q&&!a.name.toLowerCase().includes(q))return false;if(r==='Actor')return a.gender==='Actor';if(r==='Actriz')return a.gender==='Actriz';if(r)return a.role.includes(r);return true});artistGrid.innerHTML=list.map(a=>`<article class="card"><span class="badge">${esc(a.gender)} · ${esc(a.role.replace('Actor/Actriz · ','').replace('Actor/Actriz','Interpretación'))}</span><h3>${esc(a.name)}</h3><p>${esc(a.bio)}</p><div class="social">${a.web?`<a class="btn" href="${esc(a.web)}" target="_blank" rel="noopener">🌐 Más información</a>`:''}${a.instagram?`<a class="btn ghost" href="${esc(a.instagram)}" target="_blank" rel="noopener">◎ Instagram</a>`:''}${a.facebook?`<a class="btn ghost" href="${esc(a.facebook)}" target="_blank" rel="noopener">f Facebook</a>`:''}${a.youtube?`<a class="btn ghost" href="${esc(a.youtube)}" target="_blank" rel="noopener">▶ YouTube</a>`:''}</div></article>`).join('')||'<p>No se encontraron artistas.</p>'}qArtist.oninput=artistRole.onchange=renderArtists;renderArtists();
const TR={es:{title:'Actores y actrices',intro:'Directorio de actores y actrices vinculados al teatro costarricense.',faq:'Preguntas frecuentes',search:'Buscar artista…',all:'Todos',actors:'Actores',actresses:'Actrices',direction:'Dirección',teaching:'Docencia'},en:{title:'Actors and actresses',intro:'Directory of actors and actresses connected to Costa Rican theatre.',faq:'Frequently asked questions',search:'Search artist…',all:'All',actors:'Actors',actresses:'Actresses',direction:'Directing',teaching:'Teaching'}};let currentLang=localStorage.getItem('teatrocr-lang')||'es';const langToggle=document.getElementById('langToggle');function applyLang(l){currentLang=l;document.documentElement.lang=l;localStorage.setItem('teatrocr-lang',l);langToggle.textContent=l==='es'?'EN':'ES';document.querySelectorAll('[data-tr]').forEach(el=>{const k=el.dataset.tr;if(TR[l][k])el.textContent=TR[l][k]});document.querySelectorAll('[data-tr-placeholder]').forEach(el=>{const k=el.dataset.trPlaceholder;if(TR[l][k])el.placeholder=TR[l][k]})}langToggle.onclick=()=>applyLang(currentLang==='es'?'en':'es');applyLang(currentLang);const themeToggle=document.getElementById('themeToggle');function applyTheme(t){document.documentElement.dataset.theme=t;themeToggle.textContent=t==='dark'?'☀️ Claro':'🌙 Oscuro';localStorage.setItem('teatrocr-theme',t)}applyTheme(localStorage.getItem('teatrocr-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));themeToggle.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');</script></body></html>
